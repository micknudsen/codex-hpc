name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  product-tests:
    name: Product tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin Ubuntu to a runner with published Python 3.9 binaries.
        os: [ubuntu-24.04, macos-latest]
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - name: Test clean-installed public CLI
        run: python -m unittest discover -s tests -v

  signed-image:
    name: Signed image qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - name: Install pinned Apptainer build tools
        run: sh scripts/install_apptainer_ci.sh
      - name: Create disposable candidate signing identity
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/signing/private.pem"
          openssl pkey -in "$RUNNER_TEMP/signing/private.pem" -pubout -out "$RUNNER_TEMP/signing/public.pem"
      - name: Build, sign and qualify candidate
        run: |
          python scripts/build_candidate.py build --version 0.1.0.dev0 --output "$RUNNER_TEMP/candidate" --private-key "$RUNNER_TEMP/signing/private.pem" --public-key "$RUNNER_TEMP/signing/public.pem"
          python tests/qualify_candidate.py "$RUNNER_TEMP/candidate"
      - name: Qualify packaged setup with the real signed candidate
        env:
          CODEX_HPC_TEST_CANDIDATE: ${{ runner.temp }}/candidate
        run: python -m unittest discover -s tests -p test_setup.py -v
      - name: Qualify connect preflight with the real signed candidate
        env:
          CODEX_HPC_TEST_CANDIDATE: ${{ runner.temp }}/candidate
        run: python -m unittest discover -s tests -p test_connect.py -v
      - name: Qualify owned allocation with the real signed candidate
        env:
          CODEX_HPC_TEST_CANDIDATE: ${{ runner.temp }}/candidate
        run: python -m unittest discover -s tests -p test_allocation.py -v
      - name: Retain qualified candidate for dependent setup tests
        uses: actions/upload-artifact@v4
        with:
          name: qualified-candidate-linux-amd64
          path: ${{ runner.temp }}/candidate
          retention-days: 3
          if-no-files-found: error
      - name: Remove disposable signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
