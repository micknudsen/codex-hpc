name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      release:
        type: boolean
        default: false
    secrets:
      SIF_SIGNING_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  product-tests:
    name: Product tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin Ubuntu to a runner with published Python 3.9 binaries.
        os: [ubuntu-24.04, macos-latest]
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - name: Test clean-installed public CLI
        run: python -m unittest discover -s tests -v

  signed-image:
    name: Signed image qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - name: Install pinned Apptainer build tools
        run: sh scripts/install_apptainer_ci.sh
      - name: Create disposable candidate signing identity
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/fixture-signing"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/fixture-signing/private.pem"
          openssl pkey -in "$RUNNER_TEMP/fixture-signing/private.pem" -pubout -out "$RUNNER_TEMP/fixture-signing/public.pem"
      - name: Build, sign and qualify candidate
        run: |
          version=$(python scripts/release_identity.py version)
          python scripts/build_candidate.py prepare --version "$version" --output "$RUNNER_TEMP/fixture-candidate" --private-key "$RUNNER_TEMP/fixture-signing/private.pem" --public-key "$RUNNER_TEMP/fixture-signing/public.pem"
          python tests/qualify_candidate.py "$RUNNER_TEMP/fixture-candidate"
      - name: Qualify new and reused image selection with disposable trust
        run: python tests/qualify_selection.py "$RUNNER_TEMP/fixture-candidate" "$RUNNER_TEMP/fixture-signing/private.pem" "$RUNNER_TEMP/fixture-signing/public.pem"
      - name: Select disposable package candidate for ordinary CI
        if: ${{ !inputs.release }}
        run: |
          mv "$RUNNER_TEMP/fixture-candidate" "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP/candidate/codex-hpc-linux-amd64.sif" "$RUNNER_TEMP/selected.sif"
      - name: Prepare the new or pinned release image
        if: ${{ inputs.release }}
        env:
          SIF_SIGNING_PRIVATE_KEY: ${{ secrets.SIF_SIGNING_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          if [ -n "$SIF_SIGNING_PRIVATE_KEY" ]; then
            printf '%s\n' "$SIF_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/signing/private.pem"
            openssl pkey -in "$RUNNER_TEMP/signing/private.pem" -pubout -out "$RUNNER_TEMP/signing/public.pem"
          fi
          python scripts/release_image.py --candidate "$RUNNER_TEMP/candidate" \
            --image "$RUNNER_TEMP/selected.sif" --private-key "$RUNNER_TEMP/signing/private.pem" \
            --public-key "$RUNNER_TEMP/signing/public.pem"
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
          activate-environment: ""
      - name: Install Conda build tools
        shell: bash -l {0}
        run: conda install -y -n base --override-channels -c conda-forge conda-build conda-index
      - name: Build and install the candidate Conda package
        shell: bash -l {0}
        env:
          SOURCE: ${{ inputs.source || github.sha }}
        run: |
          python scripts/conda_release.py build --candidate "$RUNNER_TEMP/candidate" \
            --output "$RUNNER_TEMP/conda-release" --prefix "$RUNNER_TEMP/conda-qualified" --source "$SOURCE"
      - name: Qualify installed Conda commands with the real signed image
        shell: bash -l {0}
        env:
          SOURCE: ${{ inputs.source || github.sha }}
        run: |
          python scripts/conda_release.py qualify --bundle "$RUNNER_TEMP/conda-release" \
            --prefix "$RUNNER_TEMP/conda-qualified" --source "$SOURCE" --image "$RUNNER_TEMP/selected.sif"
      - name: Retain the exact qualified Conda release
        uses: actions/upload-artifact@v4
        with:
          name: codex-hpc-conda-release
          path: ${{ runner.temp }}/conda-release
          retention-days: ${{ inputs.release && 90 || 3 }}
          if-no-files-found: error
      - name: Remove disposable signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/fixture-signing"
