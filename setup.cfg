[metadata]
name = codex-hpc
version = 0.1.0.dev0
description = Run Codex in a remote workspace using a Slurm allocation
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.package_data]
codex_hpc = release/*

[options.entry_points]
console_scripts =
    codex-hpc = codex_hpc.cli:main
